<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RS Helper</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e8eaf0;
    --muted: #9aa3b2;
    --accent: #5b8def;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap { max-width: 640px; width: 100%; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p.sub { color: var(--muted); margin: 0 0 28px; font-size: 14px; }
  .cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  a.card {
    display: block;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    text-decoration: none;
    color: var(--text);
    transition: border-color .15s;
  }
  a.card:hover { border-color: var(--accent); }
  a.card h2 { font-size: 16px; margin: 0 0 6px; color: var(--accent); }
  a.card p { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.5; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>RS Helper</h1>
    <p class="sub">Pick a tool.</p>
    <div class="cards">
      <a class="card" href="/document-desk/">
        <h2>Document Desk</h2>
        <p>Load two or more documents and ask questions answered only from their content.</p>
      </a>
      <a class="card" href="/jarvis/">
        <h2>J.A.R.V.I.S.</h2>
        <p>A personal assistant with local reasoning, persistent memory, and document awareness.</p>
      </a>
    </div>
  </div>
</body>
</html>
