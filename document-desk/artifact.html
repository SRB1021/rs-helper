<title>Document Desk</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  /* Layout: fixed left stack of document cards (drop zone + list) beside a right-hand chat column; collapses to a top drawer on phone width. */
  :root {
    --bg: #faf9f7;
    --surface: #ffffff;
    --border: #e3e0da;
    --ink: #1f1d1a;
    --muted: #716b60;
    --accent: #a8491f;
    --accent-ink: #ffffff;
    --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16140f;
      --surface: #201c17;
      --border: #3a342b;
      --ink: #f1ede4;
      --muted: #a89d8c;
      --accent: #e08a52;
      --accent-ink: #1f1407;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16140f;
    --surface: #201c17;
    --border: #3a342b;
    --ink: #f1ede4;
    --muted: #a89d8c;
    --accent: #e08a52;
    --accent-ink: #1f1407;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    height: 100%;
  }
  html { height: 100%; }

  .app {
    display: flex;
    height: 100%;
    min-height: 600px;
  }

  .stack {
    width: 320px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    overflow-y: auto;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .brand h1 {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .brand p {
    margin: 0;
    font-size: 12.5px;
    color: var(--muted);
  }

  label.field-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    font-weight: 600;
    display: block;
    margin-bottom: 8px;
  }

  .drop {
    border: 1.5px dashed var(--border);
    border-radius: 10px;
    padding: 20px 14px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .drop:hover, .drop.dragover {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 7%, transparent);
  }
  .drop .hint { font-size: 11.5px; margin-top: 4px; color: var(--muted); }

  textarea, input[type="text"] {
    width: 100%;
    font-family: inherit;
    font-size: 13px;
    padding: 9px 11px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
  }
  textarea { resize: vertical; min-height: 70px; }
  textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .paste-stack { display: flex; flex-direction: column; gap: 8px; }

  button.ghost-btn {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }
  button.ghost-btn:hover { border-color: var(--accent); color: var(--accent); }

  .doc-count { color: var(--muted); font-weight: 400; }

  .doc-list { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .doc-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .doc-card .glyph {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--accent);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 5px;
    flex-shrink: 0;
  }
  .doc-card .meta { min-width: 0; flex: 1; }
  .doc-card .name {
    font-size: 12.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .doc-card .size { font-size: 11px; color: var(--muted); }
  .doc-card .remove {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 2px;
    flex-shrink: 0;
  }
  .doc-card .remove:hover { color: var(--accent); }

  .empty-note {
    font-size: 12px;
    color: var(--muted);
    font-style: italic;
  }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .thread {
    flex: 1;
    overflow-y: auto;
    padding: 28px clamp(16px, 4vw, 48px);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .turn { max-width: 640px; min-width: 0; }
  .turn.user { align-self: flex-end; }
  .turn .bubble {
    padding: 11px 15px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
  }
  .turn.user .bubble { background: var(--accent); color: var(--accent-ink); }
  .turn.assistant .bubble { background: var(--surface); border: 1px solid var(--border); }
  .turn.note { color: var(--muted); font-size: 13px; font-style: italic; max-width: 100%; }
  .turn.note .bubble { padding: 0; background: none; border: none; }

  .cite {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--accent);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    margin-top: 8px;
  }

  .composer {
    border-top: 1px solid var(--border);
    padding: 14px clamp(16px, 4vw, 48px);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  }
  .composer textarea {
    flex: 1;
    min-height: 44px;
    max-height: 160px;
  }
  .composer button {
    font-family: inherit;
    font-weight: 600;
    font-size: 13.5px;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    padding: 0 20px;
    height: 42px;
    border-radius: 9px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .composer button:disabled { opacity: 0.5; cursor: default; }
  .composer button:hover:not(:disabled) { filter: brightness(1.06); }

  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--muted);
    animation: pulse 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .typing span { animation: none; opacity: 0.6; } }

  @media (max-width: 720px) {
    .app { flex-direction: column; }
    .stack {
      width: 100%;
      border-right: none;
      border-bottom: 1px solid var(--border);
      max-height: 42vh;
    }
  }
</style>

<div class="app">
  <aside class="stack">
    <div class="brand">
      <h1>Document Desk</h1>
      <p>Add two or more documents, then ask questions across all of them.</p>
    </div>

    <div>
      <label class="field-label">Add files</label>
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="Add documents">
        Drop files here, or click to browse
        <div class="hint">.txt · .md · .csv · .json · .log · .pdf</div>
        <input type="file" id="fileInput" multiple accept=".txt,.md,.csv,.json,.log,.pdf" hidden />
      </div>
    </div>

    <div class="paste-stack">
      <label class="field-label">Or paste text</label>
      <input type="text" id="pasteName" placeholder="Document name" />
      <textarea id="pasteBox" placeholder="Paste the text of a document here"></textarea>
      <button class="ghost-btn" id="addPaste">Add as document</button>
    </div>

    <div>
      <label class="field-label">Loaded <span class="doc-count" id="docCount">(0)</span></label>
      <div class="doc-list" id="docList"></div>
      <div class="empty-note" id="emptyNote">No documents yet — add at least two to start asking questions.</div>
    </div>
  </aside>

  <section class="main">
    <div class="thread" id="thread"></div>
    <form class="composer" id="composer">
      <textarea id="question" placeholder="Ask about your documents…" rows="1"></textarea>
      <button type="submit" id="send">Ask</button>
    </form>
  </section>
</div>

<script>
(function () {
  const docs = [];
  const thread = document.getElementById('thread');
  const docList = document.getElementById('docList');
  const docCount = document.getElementById('docCount');
  const emptyNote = document.getElementById('emptyNote');
  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('fileInput');
  const composer = document.getElementById('composer');
  const question = document.getElementById('question');
  const sendBtn = document.getElementById('send');

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function ext(name) {
    const m = /\.([a-z0-9]+)$/i.exec(name);
    return m ? m[1].toUpperCase() : 'TXT';
  }

  function renderDocs() {
    docList.innerHTML = '';
    docCount.textContent = `(${docs.length})`;
    emptyNote.hidden = docs.length > 0;
    docs.forEach((d, i) => {
      const card = document.createElement('div');
      card.className = 'doc-card';
      card.innerHTML = `
        <span class="glyph">${escapeHtml(ext(d.name))}</span>
        <span class="meta">
          <div class="name" title="${escapeHtml(d.name)}">${escapeHtml(d.name)}</div>
          <div class="size">${d.text.length.toLocaleString()} chars</div>
        </span>
      `;
      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove';
      removeBtn.setAttribute('aria-label', `Remove ${d.name}`);
      removeBtn.textContent = '✕';
      removeBtn.onclick = () => { docs.splice(i, 1); renderDocs(); };
      card.appendChild(removeBtn);
      docList.appendChild(card);
    });
  }

  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  async function extractPdfText(file) {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let text = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(item => item.str).join(' ') + '\n\n';
    }
    return text.trim();
  }

  async function handleFiles(fileList) {
    for (const file of fileList) {
      let text;
      if (/\.pdf$/i.test(file.name) && window.pdfjsLib) {
        try {
          text = await extractPdfText(file);
        } catch (err) {
          addTurn('note', `Couldn't read ${file.name}: ${err.message || err}`);
          continue;
        }
      } else {
        text = await file.text();
      }
      docs.push({ name: file.name, text });
    }
    renderDocs();
  }

  drop.addEventListener('click', () => fileInput.click());
  drop.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
  });
  fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('dragover'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
  drop.addEventListener('drop', (e) => {
    e.preventDefault();
    drop.classList.remove('dragover');
    handleFiles(e.dataTransfer.files);
  });

  document.getElementById('addPaste').addEventListener('click', () => {
    const pasteBox = document.getElementById('pasteBox');
    const pasteName = document.getElementById('pasteName');
    const text = pasteBox.value.trim();
    const name = pasteName.value.trim() || `Document ${docs.length + 1}`;
    if (!text) return;
    docs.push({ name, text });
    pasteBox.value = '';
    pasteName.value = '';
    renderDocs();
  });

  function addTurn(role, content) {
    const turn = document.createElement('div');
    turn.className = `turn ${role}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (role === 'note') {
      bubble.textContent = content;
    } else {
      bubble.textContent = content;
    }
    turn.appendChild(bubble);
    thread.appendChild(turn);
    thread.scrollTop = thread.scrollHeight;
    return bubble;
  }

  addTurn('note', 'Add at least two documents on the left, then ask a question below. Answers come only from what you’ve added.');

  question.addEventListener('input', () => {
    question.style.height = 'auto';
    question.style.height = Math.min(question.scrollHeight, 160) + 'px';
  });
  question.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      composer.requestSubmit();
    }
  });

  let sampleFn = null;
  (async () => {
    try {
      sampleFn = await window.claude?.use?.('sample');
    } catch (e) {
      sampleFn = null;
    }
  })();

  composer.addEventListener('submit', async (e) => {
    e.preventDefault();
    const q = question.value.trim();
    if (!q) return;

    if (docs.length < 2) {
      addTurn('note', 'Add at least two documents first.');
      return;
    }
    if (!sampleFn) {
      addTurn('note', 'This page can’t reach Claude from here. Open it on claude.ai to ask questions.');
      return;
    }

    addTurn('user', q);
    question.value = '';
    question.style.height = 'auto';
    sendBtn.disabled = true;

    const thinking = document.createElement('div');
    thinking.className = 'turn assistant';
    thinking.innerHTML = '<div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>';
    thread.appendChild(thinking);
    thread.scrollTop = thread.scrollHeight;

    const docsBlock = docs.map((d, i) =>
      `<document index="${i + 1}" name="${escapeHtml(d.name)}">\n${d.text}\n</document>`
    ).join('\n\n');

    const prompt = [
      { role: 'user', content:
        `Answer the question using only the documents below. Name which document(s) your answer draws from. If the answer isn't in the documents, say so plainly rather than guessing.\n\n${docsBlock}\n\nQuestion: ${q}`
      }
    ];

    try {
      const result = await sampleFn(prompt, {
        onText: ({ text }) => {
          thinking.querySelector('.bubble').textContent = text || '';
          thread.scrollTop = thread.scrollHeight;
        }
      });
      thinking.querySelector('.bubble').textContent = result.text || '(no answer)';
    } catch (err) {
      thinking.querySelector('.bubble').textContent =
        err?.code === 'not_granted'
          ? 'Permission to ask Claude was declined for this page.'
          : `Something went wrong: ${err?.message || err}`;
    } finally {
      sendBtn.disabled = false;
      thread.scrollTop = thread.scrollHeight;
    }
  });
})();
</script>
